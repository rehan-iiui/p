<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ultimate Street Racing</title>

    <link rel="stylesheet" href="race.css">

    <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
</head>

<body>

<div id="game">

    <div id="hud">

        <div class="topLeft">
            <div class="position">
                <strong id="position">1</strong>
                <span>POSITION</span>
            </div>

            <div class="lap">
                <strong id="lap">1 / 3</strong>
                <span>LAP</span>
            </div>
        </div>

        <div class="raceTitle">
            <span>ULTIMATE</span>
            <strong>STREET RACING</strong>
        </div>

        <div class="topRight">
            <div class="speed">
                <strong id="speed">0</strong>
                <span>KM/H</span>
            </div>

            <div class="nitro">
                <span>NITRO</span>
                <div class="nitroBar">
                    <div id="nitroFill"></div>
                </div>
            </div>
        </div>

    </div>


    <div id="countdown">3</div>


    <div id="controls">

        <span><b>W</b> ACCELERATE</span>
        <span><b>S</b> BRAKE</span>
        <span><b>A</b><b>D</b> STEER</span>
        <span><b>SHIFT</b> NITRO</span>
        <span><b>SPACE</b> DRIFT</span>

    </div>


    <div id="finishScreen" class="hidden">

        <div class="finishPanel">

            <span>RACE COMPLETE</span>

            <h1 id="finishTitle">
                1ST PLACE
            </h1>

            <div class="finishStats">
                <div>
                    <strong id="finishPosition">1st</strong>
                    <small>POSITION</small>
                </div>

                <div>
                    <strong id="finishTime">00:00</strong>
                    <small>TIME</small>
                </div>
            </div>

            <button id="restart">
                REMATCH
            </button>

            <button id="back">
                BACK TO CONSOLE
            </button>

        </div>

    </div>

</div>

<script src="race.js"></script>

</body>
</html>
